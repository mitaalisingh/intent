<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 16px;
      background: #faf8f5;
      color: #2b2b2b;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.hint { margin: 0 0 12px; color: #6b6b6b; font-size: 14px; }
    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 10px 12px;
      text-align: left;
      font: inherit;
      background: #fff;
      border: 2px solid #ddd8d0;
      border-radius: 10px;
      cursor: pointer;
    }
    button strong { display: block; font-size: 17px; }
    button span { font-size: 14px; color: #6b6b6b; }
    button.selected { border-color: #4a7c6b; background: #eef5f1; }
  </style>
</head>
<body>
  <h1>Intent</h1>
  <p class="hint">How strict should YouTube be? Shorts stay off at every level.</p>
  <div id="levels"></div>
  <script src="levels.js"></script>
  <script src="popup.js"></script>
</body>
</html>
